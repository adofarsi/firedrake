name: Validate nonspatial scalar spaces

on:
  push:
    branches: [experiment/validate-nonspatial-scalar-space]

permissions:
  contents: read

jobs:
  parameters:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: real
            image: firedrakeproject/firedrake-vanilla-default@sha256:f1b31471d540f915bd53efb92224306967fa6ec93c6ce37c727c43e02d53aac0
          - variant: complex
            image: firedrakeproject/firedrake-vanilla-complex@sha256:ff2a7711ce81d269e53d0d777f162211015b501205dabee79090c1d045547621
    container:
      image: ${{ matrix.image }}
      options: --cpus 2 --memory 6g
    env:
      PYTEST_ADDOPTS: --color=no -o faulthandler_timeout=35
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      PYOP3_SPMD_STRICT: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: a6b64e038d777035ca004d859e3d7b2a558f3bef
          fetch-depth: 2
          path: firedrake-repo
      - uses: actions/checkout@v7
        with:
          repository: adofarsi/ufl
          ref: 7278d87c16d94a1fe4d063365065704d571e6917
          fetch-depth: 2
          path: ufl-src
      - uses: actions/checkout@v7
        with:
          repository: firedrakeproject/fiat
          ref: a02d8ce77a2c88f14c754127422f01ddc6febfd9
          path: fiat-src
      - uses: actions/checkout@v7
        if: matrix.variant == 'real'
        with:
          sparse-checkout: .github/validation
          path: validation-src
      - name: Install pinned sources and PyTorch
        id: install
        run: |
          python3 -m venv --system-site-packages /tmp/parameters-venv
          /tmp/parameters-venv/bin/python -m pip install --no-deps --no-build-isolation -e ./ufl-src
          /tmp/parameters-venv/bin/python -m pip install --no-deps --no-build-isolation --config-settings editable_mode=compat -e ./fiat-src
          /tmp/parameters-venv/bin/python -m pip install --no-deps --no-build-isolation --config-settings editable_mode=compat -e ./firedrake-repo
          /tmp/parameters-venv/bin/python -m pip install 'mpi-pytest>=2026.0' pytest flake8 cython-lint
          /tmp/parameters-venv/bin/python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
          mkdir -p results
          git -C ufl-src diff --exit-code HEAD
          git -C firedrake-repo rev-parse HEAD > results/firedrake-sha.txt
          git -C ufl-src rev-parse HEAD > results/ufl-sha.txt
          git -C fiat-src rev-parse HEAD > results/fiat-sha.txt
          /tmp/parameters-venv/bin/python -m pip freeze > results/pip-freeze.txt
          /tmp/parameters-venv/bin/python - <<'PY'
          import json, platform
          from pathlib import Path
          import firedrake, ufl, torch
          from firedrake.ml.pytorch import MLParameters
          from firedrake.utils import complex_mode
          from petsc4py import PETSc
          assert str(Path(firedrake.__file__).resolve()).startswith(str(Path('firedrake-repo').resolve()))
          assert str(Path(ufl.__file__).resolve()).startswith(str(Path('ufl-src').resolve()))
          report = {'python': platform.python_version(), 'petsc': PETSc.Sys.getVersion(), 'complex_mode': complex_mode, 'torch': torch.__version__}
          Path('results/environment.json').write_text(json.dumps(report, indent=2))
          print(report)
          PY
      - name: Verify the merged UFL and Firedrake source for the integration runs
        if: always() && steps.install.outcome == 'success'
        run: |
          test "$(git -C ufl-src rev-parse HEAD)" = 7278d87c16d94a1fe4d063365065704d571e6917
          test "$(git -C firedrake-repo rev-parse HEAD)" = a6b64e038d777035ca004d859e3d7b2a558f3bef
          git -C ufl-src diff --exit-code HEAD
          git -C firedrake-repo diff --exit-code HEAD
      - name: Scalar integration and ownership
        if: always() && steps.install.outcome == 'success'
        run: |
          cd firedrake-repo
          result=0
          for ranks in 1 2; do
            timeout -k 10s 140s mpiexec --oversubscribe -n "$ranks" /tmp/parameters-venv/bin/python -m pytest -v --tb=short -m 'parallel[match]' tests/firedrake/regression/test_real_space.py -k 'nonspatial or mesh_independent_real_space' 2>&1 | tee "../results/scalar-n${ranks}.log" || result=$?
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scalar-integrals-${{ matrix.variant }}
          path: results/scalar-*.log
      - name: Transfer and taped gradients across rank groups
        if: always() && steps.install.outcome == 'success'
        run: |
          cd firedrake-repo
          result=0
          for ranks in 2 3 4; do
            timeout -k 10s 130s mpiexec --oversubscribe -n "$ranks" /tmp/parameters-venv/bin/python -m pytest -v --tb=short -m 'parallel[match]' tests/firedrake/{ensemble/test_ensemble,adjoint/test_assemble,external_operators/test_pytorch_operator}.py -k 'nonspatial_transfer or ml_parameters_group_training' 2>&1 | tee "../results/transfer-n${ranks}.log" || result=$?
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scalar-transfers-${{ matrix.variant }}
          path: results/transfer-*.log
      - name: Source lint
        if: steps.install.outcome == 'success' && matrix.variant == 'real'
        run: |
          cd firedrake-repo
          PATH=/tmp/parameters-venv/bin:$PATH make srclint 2>&1 | tee ../results/srclint.txt
      - name: Train and differentiate with native parameters on one MPI rank
        if: always() && steps.install.outcome == 'success'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/parameters-n1
        run: |
          cd firedrake-repo
          timeout -k 10s 180s mpiexec --oversubscribe -n 1 /tmp/parameters-venv/bin/python -m pytest -v --tb=short -m 'parallel[match]' tests/firedrake/external_operators/test_pytorch_operator.py -k ml_parameters --junitxml=../results/parameters-n1.xml 2>&1 | tee ../results/parameters-n1.log
      - name: Train and differentiate with native parameters on two MPI ranks
        if: always() && steps.install.outcome == 'success'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/parameters-n2
        run: |
          cd firedrake-repo
          timeout -k 10s 180s mpiexec --oversubscribe -n 2 /tmp/parameters-venv/bin/python -m pytest -v --tb=short -m 'parallel[match]' tests/firedrake/external_operators/test_pytorch_operator.py -k ml_parameters --junitxml=../results/parameters-n2.xml 2>&1 | tee ../results/parameters-n2.log
      - name: Generic space and FormSum regressions
        if: always() && steps.install.outcome == 'success'
        run: |
          cd firedrake-repo
          for ranks in 1 2; do
            mpiexec --oversubscribe -n "$ranks" /tmp/parameters-venv/bin/python -m pytest -v --tb=short -m 'parallel[match]' tests/firedrake/regression/{test_assemble_baseform,test_real_space}.py -k 'vector_formsum_rejects or mesh_independent_real_space'
          done
      - name: Check scalar-to-scalar matrix assembly
        if: always() && steps.install.outcome == 'success'
        run: |
          /tmp/parameters-venv/bin/python - <<'PYTHON' | tee results/scalar-matrix.txt
          import firedrake as fd
          mesh = fd.UnitIntervalMesh(4)
          P = fd.FunctionSpace(fd.NonSpatialDomain(mesh.comm), 'Real', 0)
          form = fd.inner(fd.TrialFunction(P), fd.TestFunction(P)) * fd.dx(domain=mesh)
          for mat_type in (None, 'matfree'):
              try:
                  A = fd.assemble(form, mat_type=mat_type)
                  y = fd.assemble(fd.action(A, fd.Function(P, val=2.0)))
              except NotImplementedError as error:
                  assert mat_type is None and 'matfree' in str(error)
                  print(f'{mat_type=}: {error}')
              else:
                  assert abs(y.dat.data_ro_with_halos.item() - 2) < 1.e-12
                  print(f'{mat_type=}: action agrees with the analytic result')
          PYTHON
      - name: Train on an interval and a square for ten optimizer steps
        if: always() && steps.install.outcome == 'success' && matrix.variant == 'real'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/parameters-training-loop
        run: |
          for ranks in 1 2; do
            timeout -k 10s 180s mpiexec --oversubscribe -n "$ranks" /tmp/parameters-venv/bin/python validation-src/.github/validation/train_on_shared_ranks.py 2>&1 | tee "results/training-loop-n${ranks}.log"
          done
      - name: Train one shared model on unequal MPI groups
        if: always() && steps.install.outcome == 'success' && matrix.variant == 'real'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/parameters-split-n3
        run: |
          timeout -k 10s 180s mpiexec --oversubscribe -n 3 /tmp/parameters-venv/bin/python validation-src/.github/validation/train_two_meshes.py 2>&1 | tee results/split-n3.log
      - name: Existing ML interfaces and coefficient differentiation
        if: always() && steps.install.outcome == 'success'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/parameters-existing
        run: |
          cd firedrake-repo
          timeout -k 15s 600s /tmp/parameters-venv/bin/python -m pytest -v --tb=short -m 'not parallel' tests/firedrake/external_operators/test_pytorch_operator.py tests/firedrake/regression/test_pytorch_coupling.py tests/firedrake/regression/test_coefficient_derivatives.py tests/firedrake/regression/test_constant.py -k 'not ml_parameters' --junitxml=../results/existing.xml 2>&1 | tee ../results/existing.log
      - name: UFL regression suite
        if: always() && steps.install.outcome == 'success' && matrix.variant == 'real'
        run: |
          cd ufl-src
          timeout -k 10s 180s /tmp/parameters-venv/bin/python -m pytest -v --tb=short test --junitxml=../results/ufl.xml 2>&1 | tee ../results/ufl.log
      - name: Dependency consistency
        if: always() && steps.install.outcome == 'success'
        run: /tmp/parameters-venv/bin/python -m pip check 2>&1 | tee results/pip-check.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-parameters-${{ matrix.variant }}
          path: results
