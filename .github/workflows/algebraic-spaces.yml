name: Validate algebraic assembly

on:
  push:
    branches: [codex/validate-algebraic-spaces]

permissions:
  contents: read

jobs:
  parameters:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: real
            image: firedrakeproject/firedrake-vanilla-default@sha256:f1b31471d540f915bd53efb92224306967fa6ec93c6ce37c727c43e02d53aac0
          - variant: complex
            image: firedrakeproject/firedrake-vanilla-complex@sha256:ff2a7711ce81d269e53d0d777f162211015b501205dabee79090c1d045547621
    container:
      image: ${{ matrix.image }}
      options: --cpus 2 --memory 6g
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      PYOP3_SPMD_STRICT: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 56fd28dcb60fa90144eb473868631cf5a2ddf242
          fetch-depth: 2
          path: firedrake-repo
      - uses: actions/checkout@v7
        with:
          repository: FEniCS/ufl
          ref: bf8a47b9b49f58a94085e2727ac2c711a2594a4b
          fetch-depth: 2
          path: ufl-src
      - uses: actions/checkout@v7
        with:
          repository: firedrakeproject/fiat
          ref: 91b20b48fd6bae52935b22c1d56cc28c986a1ead
          path: fiat-src
      - name: Install pinned sources
        id: install
        run: |
          python3 -m venv --system-site-packages /tmp/parameters-venv
          /tmp/parameters-venv/bin/python -m pip install --no-deps --no-build-isolation -e ./ufl-src
          /tmp/parameters-venv/bin/python -m pip install --no-deps --no-build-isolation --config-settings editable_mode=compat -e ./fiat-src
          /tmp/parameters-venv/bin/python -m pip install --no-deps --no-build-isolation --config-settings editable_mode=compat -e ./firedrake-repo
          /tmp/parameters-venv/bin/python -m pip install 'mpi-pytest>=2026.0' pytest flake8 cython-lint
          mkdir -p results
          git -C ufl-src diff --exit-code HEAD
          git -C firedrake-repo rev-parse HEAD > results/firedrake-sha.txt
          git -C ufl-src rev-parse HEAD > results/ufl-sha.txt
          git -C fiat-src rev-parse HEAD > results/fiat-sha.txt
          /tmp/parameters-venv/bin/python -m pip freeze > results/pip-freeze.txt
          /tmp/parameters-venv/bin/python - <<'PY'
          import json, platform
          from pathlib import Path
          import firedrake, ufl
          from firedrake.utils import complex_mode
          from petsc4py import PETSc
          assert str(Path(firedrake.__file__).resolve()).startswith(str(Path('firedrake-repo').resolve()))
          assert str(Path(ufl.__file__).resolve()).startswith(str(Path('ufl-src').resolve()))
          report = {'python': platform.python_version(), 'petsc': PETSc.Sys.getVersion(), 'complex_mode': complex_mode}
          Path('results/environment.json').write_text(json.dumps(report, indent=2))
          print(report)
          PY
      - name: Verify the merged UFL and Firedrake source for the integration runs
        if: always() && steps.install.outcome == 'success'
        run: |
          test "$(git -C ufl-src rev-parse HEAD)" = bf8a47b9b49f58a94085e2727ac2c711a2594a4b
          test "$(git -C firedrake-repo rev-parse HEAD)" = 56fd28dcb60fa90144eb473868631cf5a2ddf242
          git -C ufl-src diff --exit-code HEAD
          git -C firedrake-repo diff --exit-code HEAD
      - name: Compare the original and corrected assembler on existing mesh-backed cofunctions
        run: |
          cd firedrake-repo
          cat > /tmp/buffers.py <<'PY'
          import sys
          import numpy as np
          import firedrake as fd

          original = sys.argv[1] == "original"
          def space():
              return fd.FunctionSpace(fd.UnitIntervalMesh(4), "CG", 1).dual()
          V, W = space(), space()
          a, b, foreign, out = [fd.Cofunction(s) for s in (V, V, W, V)]
          a.dat.data_wo[:] = 2
          b.dat.data_wo[:] = 3
          foreign.dat.data_wo[:] = 7
          out.dat.data_wo[:] = 7
          def attempt(form, target):
              try:
                  fd.assemble(form, tensor=target)
              except ValueError:
                  return False
              return True
          assert attempt(2*a + 3*b, foreign) == original
          assert np.all(foreign.dat.data_ro == (13 if original else 7))
          assert not attempt(2*a + 3*foreign, out)
          assert np.all(out.dat.data_ro == (0 if original else 7))
          assert fd.assemble(2*a + 3*b, tensor=a) is a
          assert np.all(a.dat.data_ro == 13)
          if fd.COMM_WORLD.rank == 0:
              print(sys.argv[1], "foreign output", 13 if original else 7, "mixed-operand output", 0 if original else 7, "aliased output", 13)
          PY
          for revision in original corrected; do
            if [ "$revision" = original ]; then
              git show HEAD^:firedrake/assemble.py > firedrake/assemble.py
            else
              git restore firedrake/assemble.py
            fi
            for ranks in 1 2; do
              mpiexec --oversubscribe -n "$ranks" /tmp/parameters-venv/bin/python /tmp/buffers.py "$revision"
            done
          done
          git diff --exit-code HEAD
