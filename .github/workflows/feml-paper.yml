name: Check the nonspatial coefficient in a variational solve

on:
  push:
    branches: [codex/validate-feml-nonspatial-paper]

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base-real
            ref: a6b64e038d777035ca004d859e3d7b2a558f3bef
            image: firedrakeproject/firedrake-vanilla-default@sha256:f1b31471d540f915bd53efb92224306967fa6ec93c6ce37c727c43e02d53aac0
          - name: fixed-real
            ref: 851cb934030bce654a7720ead69c72fd012af354
            image: firedrakeproject/firedrake-vanilla-default@sha256:f1b31471d540f915bd53efb92224306967fa6ec93c6ce37c727c43e02d53aac0
          - name: fixed-complex
            ref: 851cb934030bce654a7720ead69c72fd012af354
            image: firedrakeproject/firedrake-vanilla-complex@sha256:ff2a7711ce81d269e53d0d777f162211015b501205dabee79090c1d045547621
    container:
      image: ${{ matrix.image }}
      options: --cpus 2 --memory 12g
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          path: validator
          sparse-checkout: .github/validation
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          path: fd-src
      - uses: actions/checkout@v7
        with:
          repository: adofarsi/ufl
          ref: 7278d87c16d94a1fe4d063365065704d571e6917
          path: ufl-src
      - uses: actions/checkout@v7
        with:
          repository: firedrakeproject/fiat
          ref: a02d8ce77a2c88f14c754127422f01ddc6febfd9
          path: fiat-src
      - uses: actions/checkout@v7
        with:
          repository: adofarsi/feml-missing-physics-reproducibility
          ref: afa956a40e506abc1426bfa499135c86f1ce94cd
          path: paper
      - name: Install and verify the pinned runtime
        id: install
        run: |
          mkdir results
          python3 -m venv --system-site-packages /tmp/paper-env
          source /tmp/paper-env/bin/activate
          python -m pip install --no-deps --no-build-isolation -e ./ufl-src
          python -m pip install --no-deps --no-build-isolation --config-settings editable_mode=compat -e ./fiat-src -e ./fd-src
          python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip freeze > results/versions.txt
          for repo in fd-src ufl-src fiat-src paper; do
            git -C "$repo" rev-parse HEAD > "results/$repo.sha"
            git -C "$repo" diff --exit-code HEAD
          done
          python - <<'PY'
          import firedrake, torch, ufl
          from pathlib import Path
          from petsc4py import PETSc
          print(torch.__version__, PETSc.Sys.getVersion())
          for module, repo in ((firedrake, 'fd-src'), (ufl, 'ufl-src')):
              assert Path(module.__file__).resolve().is_relative_to(Path(repo).resolve())
          PY
      - name: Reproduce the scalar solver failure on the original branches
        if: matrix.name == 'base-real'
        run: |
          if /tmp/paper-env/bin/python validator/.github/validation/paper_controls.py scalar_solve > results/solver.log 2>&1; then exit 1; fi
          /tmp/paper-env/bin/python - <<'PYRESULT'
          import json
          from pathlib import Path
          report = json.loads(Path('results/controls.json').read_text())['scalar_solve']
          assert report['error'] == "AttributeError: 'ScalarSpace' object has no attribute 'dm'", report
          print(report)
          PYRESULT
      - name: Exercise the scalar coefficient through the solver on one and two ranks
        if: matrix.name != 'base-real'
        run: |
          cd fd-src
          for n in 1 2; do
            mpiexec --oversubscribe -n "$n" /tmp/paper-env/bin/python -m pytest -q --tb=short -m 'parallel[match]' tests/firedrake/regression/test_real_space.py::test_nonspatial_coefficient_in_solver 2>&1 | tee "../results/solve-n$n.log"
          done
      - name: Run the first displacement load level with the paper model
        if: always() && matrix.name == 'fixed-real' && steps.install.outcome == 'success'
        run: |
          /tmp/paper-env/bin/python validator/.github/validation/paper_controls.py scalar_solve paper_forward 2>&1 | tee results/forward.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solver-${{ matrix.name }}
          path: results
