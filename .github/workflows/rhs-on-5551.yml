name: Cached RHS experiment on PR 5551

on:
  push:
    branches: [codex/rhs-on-5551]

permissions:
  contents: read

jobs:
  gradient:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: firedrakeproject/firedrake-vanilla-default@sha256:6b1a7eaebe1013d2eb0abbb71cb872cbf1c3f3c5c480b272a48ac130be470b1e
      options: --cpus 2 --memory 6g
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      PYOP3_SPMD_STRICT: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          path: firedrake-repo
      - uses: actions/checkout@v7
        with:
          repository: FEniCS/ufl
          ref: 95066098a270461a34d9a72381d3e1c5d9473abc
          path: ufl-src
      - name: Install the pinned sources in an isolated virtual environment
        id: install
        run: |
          python3 -m venv --system-site-packages /tmp/rhs-venv
          /tmp/rhs-venv/bin/python -m pip install --no-deps --no-build-isolation -e ./ufl-src
          /tmp/rhs-venv/bin/python -m pip install --no-deps --no-build-isolation --config-settings editable_mode=compat -e ./firedrake-repo
          /tmp/rhs-venv/bin/python -m pip install 'mpi-pytest>=2026.0' pytest
          mkdir -p results
          git -C firedrake-repo rev-parse HEAD > results/firedrake-sha.txt
          git -C ufl-src rev-parse HEAD > results/ufl-sha.txt
          /tmp/rhs-venv/bin/python -m pip freeze > results/pip-freeze.txt
          /tmp/rhs-venv/bin/python - <<'PY'
          import inspect
          from pathlib import Path
          import firedrake, ufl
          from firedrake.adjoint_utils.blocks.solving import NonlinearVariationalSolveBlock
          from petsc4py import PETSc
          source = inspect.getsource(NonlinearVariationalSolveBlock._adjoint_solve)
          assert '._components[1].assign(dJdu)' in source
          assert '"adjoint_rhs"' not in source
          assert str(Path(firedrake.__file__).resolve()).startswith(str(Path('firedrake-repo').resolve()))
          assert str(Path(ufl.__file__).resolve()).startswith(str(Path('ufl-src').resolve()))
          print('Firedrake:', firedrake.__file__)
          print('UFL:', ufl.__file__)
          print('PETSc:', PETSc.Sys.getVersion())
          Path('results/adjoint-solve-source.txt').write_text(source)
          PY
      - name: Gradient regression at one MPI rank
        if: steps.install.outcome == 'success'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/rhs-cache-n1
        run: |
          cd firedrake-repo
          mpiexec --oversubscribe -n 1 /tmp/rhs-venv/bin/python -m pytest -p rhs_5551_controls -v -s -m 'parallel[match]' tests/firedrake/adjoint/test_solving.py::test_cached_adjoint_rhs --junitxml=../results/gradient-n1.xml 2>&1 | tee ../results/gradient-n1.log
      - name: Gradient regression at two MPI ranks
        if: always() && steps.install.outcome == 'success'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/rhs-cache-n2
        run: |
          cd firedrake-repo
          mpiexec --oversubscribe -n 2 /tmp/rhs-venv/bin/python -m pytest -p rhs_5551_controls -v -s -m 'parallel[match]' tests/firedrake/adjoint/test_solving.py::test_cached_adjoint_rhs --junitxml=../results/gradient-n2.xml 2>&1 | tee ../results/gradient-n2.log
      - name: Search supported RHS shapes at one MPI rank
        if: always() && steps.install.outcome == 'success'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/rhs-search-n1
        run: |
          cd firedrake-repo
          mpiexec --oversubscribe -n 1 /tmp/rhs-venv/bin/python -m pytest -p rhs_5551_controls -v -s -m 'parallel[match]' tests/firedrake/adjoint/test_rhs_shapes_5551.py --junitxml=../results/search-n1.xml 2>&1 | tee ../results/search-n1.log
      - name: Search supported RHS shapes at two MPI ranks
        if: always() && steps.install.outcome == 'success'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/rhs-search-n2
        run: |
          cd firedrake-repo
          mpiexec --oversubscribe -n 2 /tmp/rhs-venv/bin/python -m pytest -p rhs_5551_controls -v -s -m 'parallel[match]' tests/firedrake/adjoint/test_rhs_shapes_5551.py --junitxml=../results/search-n2.xml 2>&1 | tee ../results/search-n2.log
      - name: renumber diagnostic control at 1 MPI ranks
        if: always() && steps.install.outcome == 'success'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/rhs-renumber-n1
          RHS_RENUMBER: "1"
        run: |
          cd firedrake-repo
          mpiexec --oversubscribe -n 1 /tmp/rhs-venv/bin/python -m pytest -p rhs_5551_controls -v -s -m 'parallel[match]' tests/firedrake/adjoint/test_solving.py::test_cached_adjoint_rhs --junitxml=../results/renumber-n1.xml 2>&1 | tee ../results/renumber-n1.log
      - name: renumber diagnostic control at 2 MPI ranks
        if: always() && steps.install.outcome == 'success'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/rhs-renumber-n2
          RHS_RENUMBER: "1"
        run: |
          cd firedrake-repo
          mpiexec --oversubscribe -n 2 /tmp/rhs-venv/bin/python -m pytest -p rhs_5551_controls -v -s -m 'parallel[match]' tests/firedrake/adjoint/test_solving.py::test_cached_adjoint_rhs --junitxml=../results/renumber-n2.xml 2>&1 | tee ../results/renumber-n2.log
      - name: controls diagnostic control at 1 MPI ranks
        if: always() && steps.install.outcome == 'success'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/rhs-controls-n1
          RHS_RENUMBER: "1"
          RHS_TRANSPOSE: "1"
        run: |
          cd firedrake-repo
          mpiexec --oversubscribe -n 1 /tmp/rhs-venv/bin/python -m pytest -p rhs_5551_controls -v -s -m 'parallel[match]' tests/firedrake/adjoint/test_solving.py::test_cached_adjoint_rhs tests/firedrake/adjoint/test_rhs_shapes_5551.py --junitxml=../results/controls-n1.xml 2>&1 | tee ../results/controls-n1.log
      - name: controls diagnostic control at 2 MPI ranks
        if: always() && steps.install.outcome == 'success'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/rhs-controls-n2
          RHS_RENUMBER: "1"
          RHS_TRANSPOSE: "1"
        run: |
          cd firedrake-repo
          mpiexec --oversubscribe -n 2 /tmp/rhs-venv/bin/python -m pytest -p rhs_5551_controls -v -s -m 'parallel[match]' tests/firedrake/adjoint/test_solving.py::test_cached_adjoint_rhs tests/firedrake/adjoint/test_rhs_shapes_5551.py --junitxml=../results/controls-n2.xml 2>&1 | tee ../results/controls-n2.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhs-on-5551-results
          path: results
