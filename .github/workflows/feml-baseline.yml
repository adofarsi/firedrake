name: FEML baseline on UFL and Firedrake main

on:
  push:
    branches: [codex/feml-main-baseline-20261118]

permissions:
  contents: read

jobs:
  gradient:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ufl-main
            ufl_sha: a001fce09da7fd6f4339d339eea62a69428317cb
    container:
      image: firedrakeproject/firedrake-vanilla-default@sha256:6b1a7eaebe1013d2eb0abbb71cb872cbf1c3f3c5c480b272a48ac130be470b1e
      options: --cpus 2 --memory 6g
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      PYOP3_SPMD_STRICT: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          path: firedrake-repo
      - uses: actions/checkout@v7
        with:
          repository: FEniCS/ufl
          ref: ${{ matrix.ufl_sha }}
          path: ufl-src
      - name: Install the pinned sources in an isolated virtual environment
        id: install
        run: |
          python3 -m venv --system-site-packages /tmp/rhs-venv
          /tmp/rhs-venv/bin/python -m pip install --no-deps --no-build-isolation -e ./ufl-src
          /tmp/rhs-venv/bin/python -m pip install --no-deps --no-build-isolation --config-settings editable_mode=compat -e ./firedrake-repo
          /tmp/rhs-venv/bin/python -m pip install 'mpi-pytest>=2026.0' pytest
          /tmp/rhs-venv/bin/python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
          mkdir -p results
          git -C firedrake-repo rev-parse HEAD > results/firedrake-sha.txt
          git -C ufl-src rev-parse HEAD > results/ufl-sha.txt
          /tmp/rhs-venv/bin/python -m pip freeze > results/pip-freeze.txt
          /tmp/rhs-venv/bin/python - <<'PY'
          import inspect
          from pathlib import Path
          import firedrake, ufl, torch
          from firedrake.ml.pytorch import ml_operator
          from firedrake.adjoint_utils.blocks.solving import NonlinearVariationalSolveBlock
          from petsc4py import PETSc
          source = inspect.getsource(NonlinearVariationalSolveBlock._adjoint_solve)
          assert str(Path(firedrake.__file__).resolve()).startswith(str(Path('firedrake-repo').resolve()))
          assert str(Path(ufl.__file__).resolve()).startswith(str(Path('ufl-src').resolve()))
          print('Firedrake:', firedrake.__file__)
          print('UFL:', ufl.__file__)
          print('PETSc:', PETSc.Sys.getVersion())
          print('PyTorch:', torch.__version__)
          print('ML factory:', inspect.signature(ml_operator))
          Path('results/adjoint-solve-source.txt').write_text(source)
          assert 'model_parameters' not in inspect.signature(ml_operator).parameters
          PY
      - name: ml-solve at 1 MPI ranks
        if: always() && steps.install.outcome == 'success'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/feml-main-ml-solve-n1
        run: |
          cd firedrake-repo
          set +e
          mpiexec --oversubscribe -n 1 /tmp/rhs-venv/bin/python -m pytest -v -s --tb=short -m 'parallel[match]' tests/firedrake/adjoint/test_feml_main_baseline.py::test_ml_solve_gradient --junitxml=../results/ml-solve-n1.xml 2>&1 | tee ../results/ml-solve-n1.log
          feml_test_exit=${PIPESTATUS[0]}
          echo "$feml_test_exit" > ../results/ml-solve-n1.exit
          exit "$feml_test_exit"
      - name: ml-solve at 2 MPI ranks
        if: always() && steps.install.outcome == 'success'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/feml-main-ml-solve-n2
        run: |
          cd firedrake-repo
          set +e
          mpiexec --oversubscribe -n 2 /tmp/rhs-venv/bin/python -m pytest -v -s --tb=short -m 'parallel[match]' tests/firedrake/adjoint/test_feml_main_baseline.py::test_ml_solve_gradient --junitxml=../results/ml-solve-n2.xml 2>&1 | tee ../results/ml-solve-n2.log
          feml_test_exit=${PIPESTATUS[0]}
          echo "$feml_test_exit" > ../results/ml-solve-n2.exit
          exit "$feml_test_exit"
      - name: cached at 1 MPI ranks
        if: always() && steps.install.outcome == 'success'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/feml-main-cached-n1
        run: |
          cd firedrake-repo
          set +e
          mpiexec --oversubscribe -n 1 /tmp/rhs-venv/bin/python -m pytest -v -s --tb=short -m 'parallel[match]' tests/firedrake/adjoint/test_feml_main_baseline.py::test_cached_adjoint_rhs --junitxml=../results/cached-n1.xml 2>&1 | tee ../results/cached-n1.log
          feml_test_exit=${PIPESTATUS[0]}
          echo "$feml_test_exit" > ../results/cached-n1.exit
          exit "$feml_test_exit"
      - name: cached at 2 MPI ranks
        if: always() && steps.install.outcome == 'success'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/feml-main-cached-n2
        run: |
          cd firedrake-repo
          set +e
          mpiexec --oversubscribe -n 2 /tmp/rhs-venv/bin/python -m pytest -v -s --tb=short -m 'parallel[match]' tests/firedrake/adjoint/test_feml_main_baseline.py::test_cached_adjoint_rhs --junitxml=../results/cached-n2.xml 2>&1 | tee ../results/cached-n2.log
          feml_test_exit=${PIPESTATUS[0]}
          echo "$feml_test_exit" > ../results/cached-n2.exit
          exit "$feml_test_exit"
      - name: rhs-shapes at 1 MPI ranks
        if: always() && steps.install.outcome == 'success'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/feml-main-rhs-shapes-n1
        run: |
          cd firedrake-repo
          set +e
          mpiexec --oversubscribe -n 1 /tmp/rhs-venv/bin/python -m pytest -v -s --tb=short -m 'parallel[match]' tests/firedrake/adjoint/test_rhs_shapes_5551.py --junitxml=../results/rhs-shapes-n1.xml 2>&1 | tee ../results/rhs-shapes-n1.log
          feml_test_exit=${PIPESTATUS[0]}
          echo "$feml_test_exit" > ../results/rhs-shapes-n1.exit
          exit "$feml_test_exit"
      - name: rhs-shapes at 2 MPI ranks
        if: always() && steps.install.outcome == 'success'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/feml-main-rhs-shapes-n2
        run: |
          cd firedrake-repo
          set +e
          mpiexec --oversubscribe -n 2 /tmp/rhs-venv/bin/python -m pytest -v -s --tb=short -m 'parallel[match]' tests/firedrake/adjoint/test_rhs_shapes_5551.py --junitxml=../results/rhs-shapes-n2.xml 2>&1 | tee ../results/rhs-shapes-n2.log
          feml_test_exit=${PIPESTATUS[0]}
          echo "$feml_test_exit" > ../results/rhs-shapes-n2.exit
          exit "$feml_test_exit"
      - name: composition at 1 MPI ranks
        if: always() && steps.install.outcome == 'success'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/feml-main-composition-n1
        run: |
          cd firedrake-repo
          set +e
          mpiexec --oversubscribe -n 1 /tmp/rhs-venv/bin/python -m pytest -v -s --tb=short -m 'parallel[match]' tests/firedrake/regression/test_feml_readiness.py --junitxml=../results/composition-n1.xml 2>&1 | tee ../results/composition-n1.log
          feml_test_exit=${PIPESTATUS[0]}
          echo "$feml_test_exit" > ../results/composition-n1.exit
          exit "$feml_test_exit"
      - name: composition at 2 MPI ranks
        if: always() && steps.install.outcome == 'success'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/feml-main-composition-n2
        run: |
          cd firedrake-repo
          set +e
          mpiexec --oversubscribe -n 2 /tmp/rhs-venv/bin/python -m pytest -v -s --tb=short -m 'parallel[match]' tests/firedrake/regression/test_feml_readiness.py --junitxml=../results/composition-n2.xml 2>&1 | tee ../results/composition-n2.log
          feml_test_exit=${PIPESTATUS[0]}
          echo "$feml_test_exit" > ../results/composition-n2.exit
          exit "$feml_test_exit"
      - name: Check installed dependency consistency
        if: always() && steps.install.outcome == 'success'
        run: /tmp/rhs-venv/bin/python -m pip check 2>&1 | tee results/pip-check.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feml-main-baseline
          path: results
