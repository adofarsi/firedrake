name: Validate matrix adjoint output

on:
  push:
    branches: [codex/validate-adjoint-matrix-output-20261118]

permissions:
  contents: read

jobs:
  transpose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: real
            image: firedrakeproject/firedrake-vanilla-default@sha256:6b1a7eaebe1013d2eb0abbb71cb872cbf1c3f3c5c480b272a48ac130be470b1e
          - variant: complex
            image: firedrakeproject/firedrake-vanilla-complex@sha256:6c1e0921835995095fff7de9328004071f4c9d053276666bcc5e5652be5cc1df
    container:
      image: ${{ matrix.image }}
      options: --cpus 2 --memory 6g
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      PYOP3_SPMD_STRICT: 1
      VARIANT: ${{ matrix.variant }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          path: firedrake-repo
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: FEniCS/ufl
          ref: a001fce09da7fd6f4339d339eea62a69428317cb
          path: ufl-src
      - name: Install the pinned sources
        id: install
        run: |
          python3 -m venv --system-site-packages /tmp/transpose-venv
          /tmp/transpose-venv/bin/python -m pip install --no-deps --no-build-isolation -e ./ufl-src
          /tmp/transpose-venv/bin/python -m pip install --no-deps --no-build-isolation --config-settings editable_mode=compat -e ./firedrake-repo
          /tmp/transpose-venv/bin/python -m pip install 'mpi-pytest>=2026.0' pytest flake8 cython-lint
          mkdir -p results
          git -C firedrake-repo rev-parse HEAD > results/firedrake-sha.txt
          git -C ufl-src rev-parse HEAD > results/ufl-sha.txt
          /tmp/transpose-venv/bin/python -m pip freeze > results/pip-freeze.txt
          /tmp/transpose-venv/bin/python - <<'PYENV'
          import inspect, json, platform
          from pathlib import Path
          import firedrake, ufl
          from petsc4py import PETSc
          from firedrake.utils import complex_mode
          assert str(Path(firedrake.__file__).resolve()).startswith(str(Path('firedrake-repo').resolve()))
          assert str(Path(ufl.__file__).resolve()).startswith(str(Path('ufl-src').resolve()))
          report = {'python': platform.python_version(), 'petsc': PETSc.Sys.getVersion(), 'complex_mode': complex_mode}
          Path('results/environment.json').write_text(json.dumps(report, indent=2))
          print(report)
          print(PETSc.Mat.copy.__doc__)
          PYENV
      - name: Source lint
        if: steps.install.outcome == 'success' && matrix.variant == 'real'
        run: |
          cd firedrake-repo
          PATH=/tmp/transpose-venv/bin:$PATH make srclint 2>&1 | tee ../results/srclint.txt
      - name: Verify the regression fails before the fix
        if: always() && steps.install.outcome == 'success'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/transpose-before
        run: |
          cd firedrake-repo
          cp firedrake/assemble.py /tmp/assemble-fixed.py
          trap 'cp /tmp/assemble-fixed.py firedrake/assemble.py' EXIT
          git show 645f62b0bdec9ccb9f10f371be50c6a73230baec:firedrake/assemble.py > firedrake/assemble.py
          set +e
          timeout -k 10s 120s mpiexec --oversubscribe -n 1 /tmp/transpose-venv/bin/python -m pytest -q --tb=short -m 'parallel[match]' tests/firedrake/regression/test_assemble_baseform.py::test_assemble_adjoint_tensor -k 'cell and aij' --junitxml=../results/before.xml > ../results/before.log 2>&1
          result=$?
          set -e
          cat ../results/before.log
          test "$result" = 1
          /tmp/transpose-venv/bin/python - <<'PYCHECK'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('../results/before.xml').getroot().iter('testcase'))
          assert len(cases) == 2
          for case in cases:
              failure = case.find('failure')
              assert failure is not None
              assert 'MatTransposeSetPrecursor' in (failure.text or '')
          PYCHECK
          if [ "$VARIANT" = complex ]; then
            /tmp/transpose-venv/bin/python - <<'PYNEST'
          from pathlib import Path
          import ufl
          from firedrake import UnitIntervalMesh, FunctionSpace, TrialFunction, TestFunction, inner, dx, assemble
          from firedrake.petsc import PETSc
          V = FunctionSpace(UnitIntervalMesh(4), "CG", 1)
          A = assemble(inner((1 + 2j) * TrialFunction(V), TestFunction(V)) * dx, mat_type="nest")
          try:
              assemble(ufl.Adjoint(A))
          except PETSc.Error as error:
              assert 'No method conjugate for Mat of type nest' in str(error)
              Path('../results/complex-nest-before.txt').write_text(str(error))
          else:
              raise AssertionError('The expected baseline NEST limitation was not reproduced.')
          PYNEST
          fi
      - name: Matrix adjoint regression at 1 ranks
        if: always() && steps.install.outcome == 'success'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/transpose-after-n1
        run: |
          cd firedrake-repo
          set +e
          timeout -k 10s 180s mpiexec --oversubscribe -n 1 /tmp/transpose-venv/bin/python -m pytest -v --tb=short --timeout=90 --timeout-method=thread -m 'parallel[match]' tests/firedrake/regression/test_assemble_baseform.py::test_assemble_adjoint_tensor --junitxml=../results/transpose-n1.xml 2>&1 | tee ../results/transpose-n1.log
          result=${PIPESTATUS[0]}
          echo "$result" > ../results/transpose-n1.exit
          exit "$result"
      - name: Matrix adjoint regression at 2 ranks
        if: always() && steps.install.outcome == 'success'
        env:
          FIREDRAKE_CACHE_DIR: /tmp/transpose-after-n2
        run: |
          cd firedrake-repo
          set +e
          timeout -k 10s 180s mpiexec --oversubscribe -n 2 /tmp/transpose-venv/bin/python -m pytest -v --tb=short --timeout=90 --timeout-method=thread -m 'parallel[match]' tests/firedrake/regression/test_assemble_baseform.py::test_assemble_adjoint_tensor --junitxml=../results/transpose-n2.xml 2>&1 | tee ../results/transpose-n2.log
          result=${PIPESTATUS[0]}
          echo "$result" > ../results/transpose-n2.exit
          exit "$result"
      - name: Check dependency consistency
        if: always() && steps.install.outcome == 'success'
        run: /tmp/transpose-venv/bin/python -m pip check 2>&1 | tee results/pip-check.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transpose-${{ matrix.variant }}
          path: results
