name: Verify minimal interpolation example

on:
  push:
    branches: [codex/validate-interpolate-example-20261118]

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: real
            image: firedrakeproject/firedrake-vanilla-default@sha256:6b1a7eaebe1013d2eb0abbb71cb872cbf1c3f3c5c480b272a48ac130be470b1e
          - variant: complex
            image: firedrakeproject/firedrake-vanilla-complex@sha256:6c1e0921835995095fff7de9328004071f4c9d053276666bcc5e5652be5cc1df
    container:
      image: ${{ matrix.image }}
      options: --cpus 2 --memory 4g
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      FIREDRAKE_CACHE_DIR: /tmp/minimal-interpolate-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 093a12137aae649b5aae9c30b8d73f4749437284
          fetch-depth: 2
          path: firedrake-repo
      - uses: actions/checkout@v7
        with:
          repository: FEniCS/ufl
          ref: f4183ef2d0d1d66d681c1647dcf08685aee8abc2
          path: ufl-src
      - uses: actions/checkout@v7
        with:
          repository: firedrakeproject/fiat
          ref: 91b20b48fd6bae52935b22c1d56cc28c986a1ead
          path: fiat-src
      - name: Install the pinned sources
        id: install
        run: |
          python3 -m venv --system-site-packages /tmp/example-venv
          /tmp/example-venv/bin/python -m pip install --no-deps --no-build-isolation -e ./ufl-src
          /tmp/example-venv/bin/python -m pip install --no-deps --no-build-isolation --config-settings editable_mode=compat -e ./fiat-src
          /tmp/example-venv/bin/python -m pip install --no-deps --no-build-isolation --config-settings editable_mode=compat -e ./firedrake-repo
          /tmp/example-venv/bin/python -m pip install 'mpi-pytest>=2026.0' pytest
          mkdir -p results
          git -C firedrake-repo rev-parse HEAD > results/firedrake-sha.txt
          git -C ufl-src rev-parse HEAD > results/ufl-sha.txt
          git -C fiat-src rev-parse HEAD > results/fiat-sha.txt
      - name: Compare the scalar operator adjoint on unmodified main
        working-directory: firedrake-repo
        run: |
          base=4341a176cd3b926cd9bb8029f9f12316fe3a96b0
          git show "$base":firedrake/interpolation.py > firedrake/interpolation.py
          trap 'git restore firedrake/interpolation.py' EXIT
          git diff --exit-code "$base" -- . ':!tests/firedrake/regression/test_interpolate.py'
          status=0
          FIREDRAKE_CACHE_DIR=/tmp/base-n1 timeout -k 10s 120s mpiexec --oversubscribe -n 1 /tmp/example-venv/bin/python -m pytest -q --tb=short -m 'parallel[match]' -k 'scalar_scalar and operator' tests/firedrake/regression/test_interpolate.py::test_interpolate_base_form_output --junitxml=../results/base-n1.xml > ../results/base-n1.log 2>&1 || status=$?
          test "$status" -le 1
          cat ../results/base-n1.log
      - name: Test whether keeping the interpolation dual slot fixes adjoint assembly
        working-directory: firedrake-repo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("firedrake/assemble.py")
          source = path.read_text()
          old = "domains = set(extract_domains(expr.argument_slots()[0])) if isinstance(expr, ufl.Interpolate) else set()"
          new = "dual_slot = expr.argument_slots()[0] if isinstance(expr, ufl.Interpolate) else None\n            domains = set(extract_domains(dual_slot)) if dual_slot is not None else set()"
          check = "if isinstance(e, ufl.form.BaseForm) and not _can_fuse_operator(e, domains))"
          assert source.count(old) == source.count(check) == 1
          path.write_text(source.replace(old, new).replace(check, "if isinstance(e, ufl.form.BaseForm) and (e is dual_slot or not _can_fuse_operator(e, domains)))"))
          PY
          git diff -- firedrake/assemble.py > ../results/diagnostic.patch
      - name: Run the BaseForm interpolation regression with the diagnostic change
        working-directory: firedrake-repo
        run: |
          result=0
          for ranks in 1 2; do
            FIREDRAKE_CACHE_DIR=/tmp/regression-n${ranks} timeout -k 10s 240s mpiexec --oversubscribe -n "$ranks" /tmp/example-venv/bin/python -m pytest -q --tb=short -m 'parallel[match]' tests/firedrake/regression/test_interpolate.py::test_interpolate_base_form_output --junitxml=../results/tests-n${ranks}.xml 2>&1 | tee ../results/tests-n${ranks}.log || result=1
          done
          exit "$result"
      - name: Check existing interpolation fusion cases with the diagnostic change
        if: always() && steps.install.outcome == 'success'
        working-directory: firedrake-repo
        run: |
          /tmp/example-venv/bin/python -m pytest -q --tb=short tests/firedrake/regression/test_interp_dual.py -m 'not parallel' -k 'partial_fusion or nested' --junitxml=../results/fusion.xml 2>&1 | tee ../results/fusion.log
      - name: Run the self-contained example
        if: always() && steps.install.outcome == 'success'
        run: |
          cat > results/example.py <<'PY'
          from firedrake import *

          mesh = UnitIntervalMesh(4)
          V = VectorFunctionSpace(mesh, "CG", 1, dim=2)
          Q = FunctionSpace(mesh, "CG", 1)
          D = FunctionSpace(mesh, "DG", 0)
          x, = SpatialCoordinate(mesh)

          # Build a linear map that sums the two vector components.
          u = TrialFunction(V)
          A = assemble(interpolate(u[0] + u[1], Q))

          # Interpolate the map's scalar output into a DG0 space.
          transfer = interpolate(A, D)

          f = Function(V).interpolate(as_vector((1 + x, 2 - x)))
          result = assemble(action(transfer, f))
          expected = Function(D).assign(3)
          error = norm(assemble(result - expected))
          assert error < 1e-12
          if mesh.comm.rank == 0:
              print(f"Scalar result is 3 everywhere. L2 error = {error:.2e}")
          PY
          for ranks in 1 2; do
            timeout -k 10s 120s mpiexec --oversubscribe -n "$ranks" /tmp/example-venv/bin/python results/example.py 2>&1 | tee results/example-n${ranks}.log
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimal-interpolation-example-${{ matrix.variant }}
          path: results
