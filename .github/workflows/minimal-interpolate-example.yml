name: Verify nested interpolation adjoints

on:
  push:
    branches: [codex/validate-interpolate-example-20261118]

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: real
            image: firedrakeproject/firedrake-vanilla-default@sha256:6b1a7eaebe1013d2eb0abbb71cb872cbf1c3f3c5c480b272a48ac130be470b1e
          - variant: complex
            image: firedrakeproject/firedrake-vanilla-complex@sha256:6c1e0921835995095fff7de9328004071f4c9d053276666bcc5e5652be5cc1df
    container:
      image: ${{ matrix.image }}
      options: --cpus 2 --memory 4g
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      FIREDRAKE_CACHE_DIR: /tmp/minimal-interpolate-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: b4a34e6a278ebcf2710b86cb58fd4425a78d93f4
          fetch-depth: 2
          path: firedrake-repo
      - uses: actions/checkout@v7
        with:
          repository: FEniCS/ufl
          ref: f4183ef2d0d1d66d681c1647dcf08685aee8abc2
          path: ufl-src
      - uses: actions/checkout@v7
        with:
          repository: firedrakeproject/fiat
          ref: 91b20b48fd6bae52935b22c1d56cc28c986a1ead
          path: fiat-src
      - name: Install the pinned sources
        id: install
        run: |
          python3 -m venv --system-site-packages /tmp/example-venv
          /tmp/example-venv/bin/python -m pip install --no-deps --no-build-isolation -e ./ufl-src
          /tmp/example-venv/bin/python -m pip install --no-deps --no-build-isolation --config-settings editable_mode=compat -e ./fiat-src
          /tmp/example-venv/bin/python -m pip install --no-deps --no-build-isolation --config-settings editable_mode=compat -e ./firedrake-repo
          /tmp/example-venv/bin/python -m pip install 'mpi-pytest>=2026.0' pytest
          mkdir -p results
          git -C firedrake-repo rev-parse HEAD > results/firedrake-sha.txt
          git -C ufl-src rev-parse HEAD > results/ufl-sha.txt
          git -C fiat-src rev-parse HEAD > results/fiat-sha.txt
      - name: Reproduce the new regression on the unmodified base
        working-directory: firedrake-repo
        run: |
          base=76e00a7b2df6319f390126de75043d47dea6119f
          test "$(git rev-parse HEAD^)" = "$base"
          git show "$base":firedrake/assemble.py > firedrake/assemble.py
          trap 'git restore -- firedrake/assemble.py' EXIT
          git diff --exit-code "$base" -- . ':(exclude)tests/firedrake/regression/test_interp_dual.py'
          status=0
          FIREDRAKE_CACHE_DIR=/tmp/base-n1 timeout -k 10s 180s mpiexec --oversubscribe -n 1 /tmp/example-venv/bin/python -m pytest -q --tb=short -m 'parallel[match]' tests/firedrake/regression/test_interp_dual.py::test_nested_interp_adjoint --junitxml=../results/base-n1.xml > ../results/base-n1.log 2>&1 || status=$?
          cat ../results/base-n1.log
          test "$status" -eq 1
          python3 - <<'PYTEST'
          from xml.etree import ElementTree as ET
          suite = ET.parse('../results/base-n1.xml').getroot().find('testsuite')
          assert suite.get('tests') == suite.get('failures') == '1'
          failure = suite.find('testcase/failure').text
          assert 'base_form_assembly_visitor' in failure and 'not enough values to unpack' in failure, failure
          PYTEST
      - name: Check the standalone fix at one and two ranks
        if: always() && steps.install.outcome == 'success'
        working-directory: firedrake-repo
        run: |
          git diff --exit-code HEAD
          result=0
          for ranks in 1 2; do
            FIREDRAKE_CACHE_DIR=/tmp/standalone-n${ranks} timeout -k 10s 180s mpiexec --oversubscribe -n "$ranks" /tmp/example-venv/bin/python -m pytest -q --tb=short -m 'parallel[match]' tests/firedrake/regression/test_interp_dual.py::test_nested_interp_adjoint --junitxml=../results/standalone-n${ranks}.xml 2>&1 | tee ../results/standalone-n${ranks}.log || result=1
          done
          exit "$result"
      - name: Check interpolation fusion, base forms and external operators
        if: always() && steps.install.outcome == 'success'
        working-directory: firedrake-repo
        run: |
          /tmp/example-venv/bin/python -m pytest -q --tb=short tests/firedrake/regression/test_interp_dual.py -m 'not parallel' -k 'partial_fusion or nested' --junitxml=../results/fusion.xml 2>&1 | tee ../results/fusion.log
          timeout -k 10s 360s /tmp/example-venv/bin/python -m pytest -q --tb=short -m 'not parallel' tests/firedrake/regression/test_assemble_baseform.py tests/firedrake/external_operators/test_abstract_external_operator.py tests/firedrake/external_operators/test_external_operators.py::test_assemble --junitxml=../results/assembly.xml 2>&1 | tee ../results/assembly.log
      - name: Check the new fix together with the separate patch from PR 5664
        if: always() && steps.install.outcome == 'success'
        working-directory: firedrake-repo
        run: |
          pr5664=093a12137aae649b5aae9c30b8d73f4749437284
          git fetch --no-tags --depth=2 origin "$pr5664"
          git diff --binary "$pr5664^2" "$pr5664" | git apply
          git diff --stat HEAD
          result=0
          for ranks in 1 2; do
            FIREDRAKE_CACHE_DIR=/tmp/combined-n${ranks} timeout -k 10s 240s mpiexec --oversubscribe -n "$ranks" /tmp/example-venv/bin/python -m pytest -q --tb=short -m 'parallel[match]' tests/firedrake/regression/test_interpolate.py::test_interpolate_base_form_output --junitxml=../results/combined-n${ranks}.xml 2>&1 | tee ../results/combined-n${ranks}.log || result=1
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interpolation-dual-slot-${{ matrix.variant }}
          path: results
